name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  spec:
    runs-on: ubuntu-latest
    # spec/db runs its apps against this server, which trusts every login as
    # the guestbook's development setup does.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned, as kq pins it: a senro pull request is tested against a fixed
      # compiler, so its failures are its own, and moving the pin is a pull
      # request of its own whose diff is the compiler and nothing else.
      - name: build the pinned kanso toolchain
        run: |
          git clone https://github.com/kanso-lang/kanso /tmp/kanso
          cd /tmp/kanso && git checkout "$(cat $GITHUB_WORKSPACE/.kanso-version)"
          cargo build --release
      # A component's actions run in the browser as the app's browser module,
      # linked against kanso's runtime built for wasm32, which wants clang,
      # wasm-ld and wasi-libc. Built as kanso's own CI builds it for the
      # playground.
      - name: the kanso runtime for wasm32
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-19 lld-19 wasi-libc
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          sudo ln -sf /usr/bin/wasm-ld-19 /usr/local/bin/wasm-ld
          sh /tmp/kanso/scripts/build_runtime_wasm.sh /tmp/kanso-runtime.wasm
      # The service starts before the checkout, so it learns its certificate
      # here: spec/tls's localhost certificate, then ssl on and a reload.
      - name: Postgres serves TLS with the test certificate
        run: |
          id=${{ job.services.postgres.id }}
          dir=/var/lib/postgresql
          docker cp spec/tls/localhost.pem "$id:$dir/server.crt"
          docker cp spec/tls/localhost.key "$id:$dir/server.key"
          docker exec "$id" chown postgres "$dir/server.crt" "$dir/server.key"
          docker exec "$id" chmod 600 "$dir/server.key"
          docker exec -u postgres "$id" psql \
            -c "alter system set ssl_cert_file = '$dir/server.crt'" \
            -c "alter system set ssl_key_file = '$dir/server.key'" \
            -c "alter system set ssl = on" \
            -c "select pg_reload_conf()"
      # spec/browser drives the guestbook in Firefox, the browser senro is
      # tuned in first, and in Chromium.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and its browsers
        run: |
          npm install --prefix /tmp/pw playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: the guestbook in Firefox on the interpreter, sixty times
        env:
          NODE_PATH: /tmp/pw/node_modules
          KANSO_RUNTIME_WASM: /tmp/kanso-runtime.wasm
        run: KANSO=/tmp/kanso/target/release/kanso sh spec/browser/loop.sh firefox interp 60
